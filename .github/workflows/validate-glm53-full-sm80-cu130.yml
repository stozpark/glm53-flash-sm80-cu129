name: Validate GLM-5.3 full SM80 CUDA13

on:
  push:
    branches: [glm53-full-sm80-cu130-v030]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: glm53-full-sm80-cu130-v030
          path: port

      - name: Checkout exact vLLM 0.30.0
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: v0.30.0
          path: vllm030

      - name: Verify current full GLM-5.3 model contract
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            https://huggingface.co/zai-org/GLM-5.3/resolve/main/config.json \
            -o /tmp/glm53-config.json
          curl -fL --retry 5 --retry-delay 2 \
            https://huggingface.co/zai-org/GLM-5.3/resolve/main/model.safetensors.index.json \
            -o /tmp/glm53-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("/tmp/glm53-config.json").read_text())
          text = cfg.get("text_config", cfg)

          assert "GlmMoeDsaForCausalLM" in cfg["architectures"], cfg["architectures"]
          assert text.get("model_type", cfg.get("model_type")) == "glm_moe_dsa"
          assert text["num_hidden_layers"] == 78
          assert text["hidden_size"] == 6144
          assert text["first_k_dense_replace"] == 3
          assert text["n_routed_experts"] == 256
          assert text["num_experts_per_tok"] == 8
          assert text["q_lora_rank"] == 2048
          assert text["kv_lora_rank"] == 512
          assert text["qk_nope_head_dim"] == 192
          assert text["qk_rope_head_dim"] == 64
          assert text["index_n_heads"] == 32
          assert text["index_head_dim"] == 128
          assert text["index_topk"] == 2048
          assert text["index_topk_freq"] == 4
          assert text["indexer_rope_interleave"] is True
          idx = text["indexer_types"]
          assert len(idx) == 78
          assert idx[38] == "full"
          assert idx[39] == "shared"
          assert idx[42] == "full"

          q = cfg.get("quantization_config", text.get("quantization_config"))
          assert q is not None
          assert q["activation_scheme"] == "dynamic"
          assert q["fmt"] == "e4m3"
          assert q["weight_block_size"] == [128, 128]

          index = json.loads(Path("/tmp/glm53-index.json").read_text())
          total_bytes = int(index["metadata"]["total_size"])
          gib = total_bytes / (1024 ** 3)
          avg16 = gib / 16.0
          # BF16 MLA latent+RoPE cache: (512+64)*2 bytes/token/layer.
          kv0 = 42 * 131072 * (512 + 64) * 2 / (1024 ** 3)
          kv1 = 36 * 131072 * (512 + 64) * 2 / (1024 ** 3)
          assert avg16 < 80.0
          print(
              f"GLM53_CHECKPOINT_SIZE_GIB={gib:.3f} "
              f"AVG_WEIGHT_GIB_PER_16GPU={avg16:.3f}"
          )
          print(
              f"GLM53_BF16_MLA_KV_128K_GIB_PER_RANK="
              f"PP0:{kv0:.3f},PP1:{kv1:.3f}"
          )
          print("GLM53_CURRENT_MODEL_CONTRACT=PASS")
          PY

      - name: Apply complete SM80 patch chain
        shell: bash
        run: |
          set -euxo pipefail
          python3 port/patch_glm53_full_sm80.py \
            --vllm-root "$PWD/vllm030/vllm" \
            --vendor "$PWD/port/vendor/glm53-full-sm80"

      - name: Verify patch scope and idempotence
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path("vllm030")
          got = set()
          for line in subprocess.check_output(
              ["git", "-C", str(root), "status", "--porcelain"], text=True
          ).splitlines():
              got.add(line[3:])

          expected = {
              "vllm/model_executor/layers/sparse_attn_indexer.py",
              "vllm/models/deepseek_v32/attention.py",
              "vllm/models/deepseek_v32/common/kernels.py",
              "vllm/model_executor/layers/attention/mla_attention.py",
              "vllm/v1/core/kv_cache_utils.py",
              "vllm/v1/kv_cache_interface.py",
              "vllm/v1/attention/backends/mla/indexer.py",
              "vllm/v1/attention/backends/registry.py",
              "vllm/v1/attention/backends/mla/triton_mla_sparse.py",
              "vllm/v1/attention/ops/fp8_sm80.py",
              "vllm/v1/attention/ops/mqa_logits_triton.py",
              "vllm/v1/attention/ops/triton_mla_sparse_kernel.py",
          }
          assert got == expected, f"unexpected patch scope: got={sorted(got)}"
          patcher = Path("port/patch_glm53_full_sm80.py").read_text()
          assert "def patch_cuda(" not in patcher
          assert "SM80_PIECEWISE_KV_BINDING_FIX" not in patcher
          print("SM80_PATCH_SCOPE=PASS")
          PY

          git -C vllm030 diff --check
          find vllm030/vllm -type f \( \
            -path '*/sparse_attn_indexer.py' -o \
            -path '*/deepseek_v32/attention.py' -o \
            -path '*/deepseek_v32/common/kernels.py' -o \
            -path '*/backends/mla/indexer.py' -o \
            -path '*/backends/registry.py' -o \
            -path '*/backends/mla/triton_mla_sparse.py' -o \
            -path '*/ops/fp8_sm80.py' -o \
            -path '*/ops/mqa_logits_triton.py' -o \
            -path '*/ops/triton_mla_sparse_kernel.py' \
          \) -print0 | sort -z | xargs -0 sha256sum > /tmp/patched.before.sha256

          python3 port/patch_glm53_full_sm80.py \
            --vllm-root "$PWD/vllm030/vllm" \
            --vendor "$PWD/port/vendor/glm53-full-sm80"

          find vllm030/vllm -type f \( \
            -path '*/sparse_attn_indexer.py' -o \
            -path '*/deepseek_v32/attention.py' -o \
            -path '*/deepseek_v32/common/kernels.py' -o \
            -path '*/backends/mla/indexer.py' -o \
            -path '*/backends/registry.py' -o \
            -path '*/backends/mla/triton_mla_sparse.py' -o \
            -path '*/ops/fp8_sm80.py' -o \
            -path '*/ops/mqa_logits_triton.py' -o \
            -path '*/ops/triton_mla_sparse_kernel.py' \
          \) -print0 | sort -z | xargs -0 sha256sum > /tmp/patched.after.sha256
          cmp /tmp/patched.before.sha256 /tmp/patched.after.sha256
          echo SM80_PATCH_IDEMPOTENT=PASS

      - name: Compile every patched Python module
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            vllm030/vllm/v1/attention/backends/registry.py \
            vllm030/vllm/v1/attention/backends/mla/indexer.py \
            vllm030/vllm/model_executor/layers/sparse_attn_indexer.py \
            vllm030/vllm/models/deepseek_v32/common/kernels.py \
            vllm030/vllm/models/deepseek_v32/attention.py \
            vllm030/vllm/model_executor/layers/attention/mla_attention.py \
            vllm030/vllm/v1/core/kv_cache_utils.py \
            vllm030/vllm/v1/kv_cache_interface.py \
            vllm030/vllm/models/deepseek_v32/nvidia/model.py \
            vllm030/vllm/v1/attention/ops/fp8_sm80.py \
            vllm030/vllm/v1/attention/backends/mla/triton_mla_sparse.py \
            vllm030/vllm/v1/attention/ops/mqa_logits_triton.py \
            vllm030/vllm/v1/attention/ops/triton_mla_sparse_kernel.py \
            port/tests/sm80_glm53_full_kernel_smoke.py \
            port/tests/validate_glm53_full_static.py \
            port/tests/test_fp8e4m3fn_reference.py

      - name: Run CPU semantic/reference validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 port/tests/validate_glm53_full_static.py \
            --vllm-root "$PWD/vllm030/vllm" \
            --port-root "$PWD/port"
          python3 port/tests/test_fp8e4m3fn_reference.py

      - name: Verify SM80 invariants
        shell: bash
        run: |
          set -euxo pipefail
          REG=vllm030/vllm/v1/attention/backends/registry.py
          IDX=vllm030/vllm/v1/attention/backends/mla/indexer.py
          SIDX=vllm030/vllm/model_executor/layers/sparse_attn_indexer.py
          KERN=vllm030/vllm/models/deepseek_v32/common/kernels.py
          ATTN=vllm030/vllm/models/deepseek_v32/attention.py
          MODEL=vllm030/vllm/models/deepseek_v32/nvidia/model.py
          MLAC=vllm030/vllm/model_executor/layers/attention/mla_attention.py
          KVI=vllm030/vllm/v1/kv_cache_interface.py
          KVU=vllm030/vllm/v1/core/kv_cache_utils.py
          MLA=vllm030/vllm/v1/attention/ops/triton_mla_sparse_kernel.py
          MQA=vllm030/vllm/v1/attention/ops/mqa_logits_triton.py

          grep -q 'TRITON_MLA_SPARSE' "$REG"
          grep -q 'supports_dense_mha_prefill = False' \
            vllm030/vllm/v1/attention/backends/mla/triton_mla_sparse.py
          grep -q 'return (KVCacheLayout.LBHNC,)' \
            vllm030/vllm/v1/attention/backends/mla/triton_mla_sparse.py
          grep -q 'is_deep_gemm_supported' "$IDX"
          ! grep -q 'has_deep_gemm()' "$IDX"

          grep -q '_sm80_fp8_fp4_mqa_logits' "$SIDX"
          grep -q 'SM80_RAGGED_INDEXER_DECODE_FIX' "$SIDX"
          grep -q 'elif needs_padded_path:' "$SIDX"
          grep -q 'using SM80 Triton DSA indexer fallback' "$SIDX"
          ! grep -q 'Sparse Attention Indexer CUDA op requires DeepGEMM' "$SIDX"

          grep -q 'SM80_SOFTWARE_E4M3FN_MQA' "$KERN"
          grep -q '_encode_e4m3fn_u8' "$KERN"
          grep -q 'index_q_fp8_storage' "$KERN"
          grep -q 'mqa_q_fp8_storage' "$KERN"
          grep -q 'supports_quant_query_input = False'             vllm030/vllm/v1/attention/backends/mla/triton_mla_sparse.py

          python3 - <<'PY'
          from pathlib import Path
          p=Path("vllm030/vllm/models/deepseek_v32/common/kernels.py")
          s=p.read_text()
          a=s.index("def _fp8_ue8m0_quantize")
          b=s.index("def _fp8_quant_and_cache_write", a)
          assert "tl.float8e4nv" not in s[a:b], "native FP8 remains in index quantizer"
          a=s.index("def _fused_q_kernel")
          b=s.index("def fused_q(", a)
          assert "tl.float8e4nv" not in s[a:b], "native FP8 remains in fused_q"
          assert "index_q_fp8_storage" in s
          assert "mqa_q_fp8_storage" in s
          print("SM80_FP8_ACTIVE_PATHS=PASS")
          PY

          grep -q 'def record_logical_topk_ready' \
            vllm030/vllm/v1/attention/backends/mla/triton_mla_sparse.py
          grep -q 'topk_backend=self.indexer.indexer_op.topk_backend' "$ATTN"
          grep -q 'SM80_TRITON_MLA_BLOCK_STRIDE_ALIGNMENT' "$MLAC"
          grep -q 'block_stride_alignment: int | None = None' "$KVI"
          grep -q 'SM80_MLA_STRIDE_ALIGNMENTS' "$KVU"
          grep -q 'math.lcm(\*stride_alignments)' "$KVU"
          ! grep -q '_sm80_pp_topk_relay_buf' "$MODEL"

          # Long-context pointer arithmetic guards.
          test "$(grep -o 'to(tl.int64)' "$MLA" | wc -l)" -ge 3
          grep -q 'block_idx.*tl.int64\|).to(tl.int64)' "$MQA"

          echo GLM53_FULL_SM80_V030_STATIC=PASS

      - name: Verify CUDA13 image definition and launchers
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^From: vllm/vllm-openai:v0.30.0$' port/Singularity.glm53-full-sm80.def
          ! grep -R 'cuda-12.9/compat\|vllm029\|cu129' \
            port/Singularity.glm53-full-sm80.def \
            port/serve_glm53_full_tp8_pp2.sh \
            port/serve_glm53_full_tp16.sh \
            port/build_glm53_full_sm80_sif.sh
          bash -n port/build_glm53_full_sm80_sif.sh
          bash -n port/verify_glm53_full_sm80_sif.sh
          bash -n port/serve_glm53_full_tp8_pp2.sh
          bash -n port/serve_glm53_full_tp16.sh
          grep -q 'sm80_glm53_full_kernel_smoke.py' port/Singularity.glm53-full-sm80.def
          grep -q 'PORT_REVISION /opt/glm53-full-sm80/PORT_REVISION' port/Singularity.glm53-full-sm80.def
          test "$(cat port/PORT_REVISION)" = "glm53-full-sm80-cu130-v030-r20260929-11"
          grep -q 'VLLM_PP_LAYER_PARTITION' port/serve_glm53_full_tp8_pp2.sh
          grep -q 'PP_LAYER_PARTITION:-42,36' port/serve_glm53_full_tp8_pp2.sh
          grep -q -- "--compilation-config '{\"cudagraph_mode\":\"NONE\"}'" port/serve_glm53_full_tp8_pp2.sh
          ! grep -q -- '--max-cudagraph-capture-size' port/serve_glm53_full_tp8_pp2.sh
          ! grep -q 'CUDAGRAPH_MODE=' port/serve_glm53_full_tp8_pp2.sh
          grep -q -- '--kv-cache-dtype bfloat16' port/serve_glm53_full_tp8_pp2.sh
          grep -q 'RUN_GPU_SMOKE:-auto' port/serve_glm53_full_tp8_pp2.sh
          grep -q 'smoke.${EXPECTED_PORT_REVISION}.gpu${first_gpu}.ok' port/serve_glm53_full_tp8_pp2.sh
          ! grep -q -- '--linear-backend' port/serve_glm53_full_tp8_pp2.sh
          ! grep -q -- '--moe-backend' port/serve_glm53_full_tp8_pp2.sh
          ! grep -q -- '--enable-prefix-caching' port/serve_glm53_full_tp8_pp2.sh
          ! grep -q -- '--env VLLM_USE_BREAKABLE_CUDAGRAPH' port/serve_glm53_full_tp8_pp2.sh
          ! grep -q -- '--env VLLM_KV_CACHE_LAYOUT' port/serve_glm53_full_tp8_pp2.sh
          grep -q 'EXPECTED_PORT_REVISION="glm53-full-sm80-cu130-v030-r20260929-11"' port/serve_glm53_full_tp8_pp2.sh
          grep -q 'GLM53_FULL_SM80_SIF_RUNTIME_STATIC=PASS' port/serve_glm53_full_tp8_pp2.sh
          grep -q 'return capability == DeviceCapability(8, 0)' \
            port/vendor/glm53-full-sm80/v1/attention/backends/mla/triton_mla_sparse.py
          grep -q 'index_rope_interleave=True' port/tests/sm80_glm53_full_kernel_smoke.py
          grep -q 'quantize_mqa=True' port/tests/sm80_glm53_full_kernel_smoke.py
          grep -q 'SM80_FUSED_Q_MQA_FP8_PACK=PASS' port/tests/sm80_glm53_full_kernel_smoke.py
          ! grep -q 'interleave=False' port/tests/sm80_glm53_full_kernel_smoke.py
          grep -q -- '--kv-cache-dtype bfloat16' port/serve_glm53_full_tp16.sh
          grep -q '"cudagraph_mode":"NONE"' port/serve_glm53_full_tp16.sh
          echo CUDA13_PROFILE=PASS
