name: Audit full patch chain against pinned base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-patch-chain.yml'
      - 'patch_47644_compat.py'
      - 'patch_runtime.py'
      - 'patch_cuda_sparse_priority.py'
      - 'patch_deepgemm_gate.py'
      - 'patch_kpool_topk_len.py'
      - 'patch_mrzhiyao_merge.py'
      - 'patch_glm53_tail.py'
      - 'verify_static.py'
      - 'tests/test_patch_runtime_unit.py'
      - 'tests/test_patch_glm53_tail_unit.py'
      - 'Singularity.def'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout self-contained backup branch
        uses: actions/checkout@v4
        with:
          ref: source-backup
          path: source-backup

      - name: Unit tests for text backports
        working-directory: main
        run: |
          set -euxo pipefail
          python tests/test_patch_runtime_unit.py
          python tests/test_patch_glm53_tail_unit.py
          python -m py_compile patch_cuda_sparse_priority.py patch_deepgemm_gate.py patch_kpool_topk_len.py patch_mrzhiyao_merge.py

      - name: Reconstruct exact glm53-flash-cu129 source subset
        run: |
          set -euxo pipefail
          rm -rf /tmp/vllm487 /tmp/vendor /tmp/stock487
          mkdir -p /tmp/vllm487 /tmp/vendor
          cp -a source-backup/backup/base487/vllm/. /tmp/vllm487/
          : > /tmp/vllm487/__init__.py
          mkdir -p \
            /tmp/vllm487/v1/attention/ops \
            /tmp/vllm487/v1/attention/backends/mla \
            /tmp/vllm487/model_executor/layers \
            /tmp/vllm487/models/glm5next/nvidia/ops \
            /tmp/vllm487/v1/worker/gpu/model_states \
            /tmp/vllm487/v1/worker/gpu/spec_decode
          cp -a source-backup/backup/vendor/. /tmp/vendor/
          mkdir -p /tmp/vendor/a800
          cp /tmp/vendor/backport/kpool_compress.py /tmp/vendor/a800/kpool_compress.py
          test -s /tmp/vendor/mrzhiyao/triton_mla_sparse_kernel.py

      - name: Apply complete patch chain to exact base snapshot
        run: |
          set -euxo pipefail
          python main/patch_47644_compat.py --vllm-root /tmp/vllm487
          python main/patch_runtime.py \
            --vllm-root /tmp/vllm487 \
            --vendor /tmp/vendor \
            --backup-root /tmp/stock487
          python main/patch_cuda_sparse_priority.py --vllm-root /tmp/vllm487
          python main/patch_deepgemm_gate.py --vllm-root /tmp/vllm487
          python main/patch_kpool_topk_len.py --vllm-root /tmp/vllm487
          python main/patch_mrzhiyao_merge.py \
            --vllm-root /tmp/vllm487 \
            --vendor /tmp/vendor
          python main/patch_glm53_tail.py \
            --vllm-root /tmp/vllm487 \
            --vendor /tmp/vendor
          python main/verify_static.py --vllm-root /tmp/vllm487

      - name: Verify selector control-flow result
        run: |
          set -euxo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          t = Path('/tmp/vllm487/platforms/cuda.py').read_text()
          m = re.search(r'sparse_tail = \[\n(?P<body>(?:\s+AttentionBackendEnum\.[A-Z0-9_]+,\n)+)\s+\]', t)
          assert m is not None
          names = [x.strip().rstrip(',') for x in m.group('body').splitlines()]
          assert names[-1] == 'AttentionBackendEnum.FLASHINFER_MLA_SPARSE_SM90'
          names.pop()
          assert 'AttentionBackendEnum.TRITON_MLA_SPARSE' in names
          print('GLM_SPARSE_SELECTOR_CONTROL_FLOW=PASS')
          PY

      - name: Verify source-backup checksums
        working-directory: source-backup
        run: |
          set -euxo pipefail
          sha256sum -c backup/SHA256SUMS.txt

      - name: Final source audit marker
        run: echo FULL_PATCH_CHAIN_SOURCE_AUDIT=PASS
